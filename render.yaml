services:
  - type: web
    name: aventos-cri-dashboard
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/trpc/system.health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APIFY_API_KEY
        sync: false
      - key: APIFY_LINKEDIN_ACTOR_ID
        sync: false
      - key: APIFY_LINKEDIN_POSTS_ACTOR_ID
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
