services:
  - type: web
    name: aventos-cri-dashboard
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node dist/index.js
    nodeVersion: 20.19.0
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APIFY_API_KEY
        sync: false
      - key: APIFY_LINKEDIN_ACTOR_ID
        sync: false
      - key: APIFY_LINKEDIN_POSTS_ACTOR_ID
        sync: false
